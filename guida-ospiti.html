<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terrazza Galba — Guida per gli ospiti</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1E4258; --primary-light:#2C5F7F; --primary-tint:#E7EEF1;
  --accent:#C86A3F; --accent-tint:#F7E6DC;
  --green:#2F9E5C; --green-tint:#E3F3EA;
  --ink:#20303A; --ink-soft:#5B6D76; --paper:#FAF7F2; --card:#FFFFFF; --line:#E3DFD6; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Work Sans',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
h1,h2,.brand{font-family:'Fraunces',serif;}
header{
  position:relative;color:#fff;padding:20px 20px 40px;
  background:linear-gradient(180deg, rgba(20,40,52,.75) 0%, rgba(20,40,52,.55) 40%, rgba(30,66,88,.92) 100%),
    url('images/dji_fly_20240728_124530_901_1722164597533_photo.jpg') center 30%/cover no-repeat;
}
.brand-block{text-align:center;max-width:960px;margin:14px auto 0;position:relative;z-index:2;}
.brand{font-size:1.5rem;font-weight:600;letter-spacing:.02em;text-shadow:0 2px 10px rgba(0,0,0,.35);}
.subtitle{font-size:.9rem;opacity:.92;margin-top:2px;font-weight:400;text-shadow:0 1px 6px rgba(0,0,0,.3);}
.lang-select{display:flex;gap:5px;flex-wrap:nowrap;justify-content:center;max-width:960px;margin:0 auto;position:relative;z-index:2;overflow-x:auto;padding-bottom:2px;}
.lang-btn{border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.1);backdrop-filter:blur(4px);color:#fff;font-size:.62rem;font-weight:600;padding:4px 6px;border-radius:999px;cursor:pointer;transition:.15s;flex-shrink:0;white-space:nowrap;}
.lang-btn:hover{background:rgba(255,255,255,.25);}
.lang-btn.active{background:#fff;color:var(--primary);border-color:#fff;}
.header-links{max-width:960px;margin:22px auto 0;position:relative;z-index:2;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.header-link-btn{border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);backdrop-filter:blur(4px);color:#fff;font-size:.82rem;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;}
.header-link-btn:hover{background:rgba(255,255,255,.24);}
main{max-width:960px;margin:0 auto;padding:28px 18px 60px;}
.hub-title{font-size:1.05rem;color:var(--ink-soft);margin-bottom:18px;text-align:center;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:8px;}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr);}}
.cat-btn{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 8px 14px;text-align:center;cursor:pointer;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:8px;}
.cat-btn:hover{border-color:var(--primary-light);transform:translateY(-2px);box-shadow:0 10px 22px rgba(30,66,88,.12);}
.cat-icon{width:42px;height:42px;border-radius:50%;background:var(--primary-tint);display:flex;align-items:center;justify-content:center;color:var(--primary);}
.cat-btn.emergenza .cat-icon{background:var(--accent-tint);color:var(--accent);}
.cat-btn.farmacie .cat-icon{background:var(--green-tint);color:var(--green);}
.cat-label{font-size:.76rem;font-weight:600;line-height:1.2;}
.view{display:none;}
.view.active{display:block;}
.back-btn{background:none;border:none;color:var(--primary);font-weight:600;font-size:.9rem;cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:16px;padding:6px 0;}
.detail-title{font-size:1.4rem;margin-bottom:4px;}
.detail-note{font-size:.85rem;color:var(--ink-soft);margin-bottom:20px;}
.section-label{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin:22px 0 10px;}
.section-label:first-of-type{margin-top:0;}
.venue-list{display:flex;flex-direction:column;gap:12px;}
.venue-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.venue-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.venue-name{font-weight:600;font-size:1rem;}
.tip-badge{font-size:.62rem;font-weight:700;color:var(--accent);background:var(--accent-tint);padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;}
.venue-address{font-size:.85rem;color:var(--ink-soft);margin:2px 0 8px;}
.venue-desc{font-size:.85rem;color:var(--ink);margin:4px 0 10px;font-style:italic;}
.venue-actions{display:flex;gap:10px;flex-wrap:wrap;}
.venue-actions a{font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-maps{background:var(--primary);color:#fff;}
.btn-maps:hover{background:var(--primary-light);}
.btn-call{background:var(--primary-tint);color:var(--primary);}
.btn-call:hover{background:#dce9ef;}
.btn-link{background:var(--accent-tint);color:var(--accent);}
.btn-link:hover{background:#f1d5c2;}
.empty-state{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:28px 18px;text-align:center;color:var(--ink-soft);font-size:.9rem;}
.emergency-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
@media(min-width:520px){.emergency-grid{grid-template-columns:repeat(4,1fr);}}
.emergency-num{background:var(--accent-tint);border-radius:var(--radius);padding:14px 10px;text-align:center;}
.emergency-num a{font-size:1.5rem;font-weight:700;color:var(--accent);text-decoration:none;display:block;}
.emergency-num span{font-size:.72rem;color:var(--ink-soft);display:block;margin-top:2px;}
.article-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
.article-title{font-weight:600;font-size:1.05rem;margin-bottom:6px;color:var(--primary);}
.article-preview{font-size:.88rem;color:var(--ink-soft);margin-bottom:12px;line-height:1.5;}
.article-actions{display:flex;gap:10px;flex-wrap:wrap;}
.article-actions a{font-size:.8rem;font-weight:600;padding:8px 14px;border-radius:999px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-read{background:var(--primary-tint);color:var(--primary);}
.external-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:32px 24px;text-align:center;}
.external-box p{color:var(--ink-soft);font-size:.9rem;margin-bottom:20px;}
.big-btn{background:var(--primary);color:#fff;border:none;font-size:.95rem;font-weight:600;padding:13px 26px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;}
.big-btn:hover{background:var(--primary-light);}
.info-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;line-height:1.6;font-size:.92rem;}
.info-box h4{color:var(--primary);margin:16px 0 4px;font-size:.95rem;}
.info-box h4:first-child{margin-top:0;}
.wifi-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.wifi-row:last-child{border-bottom:none;}
.wifi-label{font-size:.8rem;color:var(--ink-soft);}
.wifi-value{font-weight:700;font-size:1.05rem;letter-spacing:.02em;}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;max-width:480px;margin:0 auto;}
.form-field{margin-bottom:16px;text-align:left;}
.form-field label{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px;color:var(--ink);}
.form-field input, .form-field select, .form-field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:.9rem;}
.form-field textarea{resize:vertical;min-height:90px;}
.char-count{font-size:.72rem;color:var(--ink-soft);text-align:right;margin-top:3px;}
.form-msg{font-size:.85rem;margin-top:12px;display:none;padding:10px;border-radius:10px;}
.form-msg.ok{display:block;background:var(--green-tint);color:var(--green);}
.form-msg.err{display:block;background:var(--accent-tint);color:var(--accent);}
.tip-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;}
.tip-meta{font-size:.72rem;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
.tip-text{font-size:.9rem;}
footer{text-align:center;font-size:.72rem;color:var(--ink-soft);padding:20px;}
</style>
</head>

<header>
  <div class="lang-select" id="langSelect"></div>
  <div class="brand-block">
    <div class="brand">Terrazza Galba</div>
    <div class="subtitle" data-i18n="subtitle">Guida per gli ospiti</div>
  </div>
  <div class="header-links">
    <a href="#" class="header-link-btn" data-open="come-arrivare">📍 <span data-i18n="comeArrivareShort">Come arrivare</span></a>

</header>

<main>
  <section id="hub" class="view active">
    <p class="hub-title" data-i18n="hubTitle">Tutto quello che ti serve durante il soggiorno a Terracina.</p>
    <div class="grid" id="catGrid"></div>
  </section>

  <section id="subHub" class="view">
    <button class="back-btn" data-back="hub">← <span data-i18n="back">Torna al menu</span></button>
    <h2 class="detail-title" id="subHubTitle"></h2>
    <p class="detail-note" id="subHubNote"></p>
    <div class="grid" id="subHubGrid"></div>
  </section>

  <section id="detailView" class="view">
    <button class="back-btn" id="backBtn">← <span id="backLabel"></span></button>
    <h2 class="detail-title" id="detailTitle"></h2>
    <p class="detail-note" id="detailNote"></p>
    <div id="emergencyNumbers"></div>
    <div id="articleList"></div>
    <div id="pinsLabel" class="section-label" style="display:none;"></div>
    <div class="venue-list" id="venueList"></div>
  </section>

  <section id="externalView" class="view">
    <button class="back-btn" data-back="hub">← <span data-i18n="back">Torna al menu</span></button>
    <h2 class="detail-title" id="externalTitle"></h2>
    <div class="external-box" id="externalBox"></div>
  </section>

  <section id="infoView" class="view">
    <button class="back-btn" data-back="hub">← <span data-i18n="back">Torna al menu</span></button>
    <h2 class="detail-title" id="infoTitle"></h2>
    <div class="info-box" id="infoBox"></div>
  </section>

  <section id="tipFormView" class="view">
    <button class="back-btn" data-back="consigliHub">← <span data-i18n="back">Torna al menu</span></button>
    <h2 class="detail-title" id="tipFormTitle"></h2>
    <div class="form-card" id="tipFormCard"></div>
  </section>

  <section id="tipListView" class="view">
    <button class="back-btn" data-back="consigliHub">← <span data-i18n="back">Torna al menu</span></button>
    <h2 class="detail-title" id="tipListTitle"></h2>
    <div id="tipListBox"></div>
  </section>
</main>

<footer data-i18n="footer">Dati verificati a settembre 2026 · orari e contatti possono variare</footer>

const RACCOLTA_HTML = {
  it:"<p><u>La raccolta viene svolta in modalità \"porta a porta\": lasciare la spazzatura fuori il portone la sera prima o, al più tardi, entro le 5:00 del mattino.</u></p><h4>Organico</h4><p>SÌ: cibo, alimenti, fazzoletti sporchi, foglie, cenere.<br>NO: assorbenti, pannolini, stracci, spugne, gomme, sigarette.<br><b>Ritiro: lunedì, mercoledì, sabato</b> (entro le 5:00)</p><h4>Carta</h4><p>SÌ: giornali, riviste, cartone, imballaggi, confezioni tetra-pak, fogli.<br>NO: carta plastificata, carta da forno, carta o cartoni sporchi.<br><b>Ritiro: venerdì</b> (entro le 5:00)</p><h4>Plastica e metalli</h4><p>SÌ: bottiglie, flaconi, imballaggi in plastica, piatti e bicchieri monouso, buste, vaschette, pellicole, scatole, lattine, alluminio, tubetti.<br>NO: giocattoli, posate rotte, oggetti in gomma, penne.<br><b>Ritiro: giovedì</b> (a luglio e agosto anche la domenica, entro le 5:00)</p><h4>Secco / indifferenziato</h4><p>SÌ: pannolini, assorbenti, stracci, spugne, spazzolini, gomma, posate sporche, sigarette, lampadine, ceramica.<br><b>Ritiro: martedì</b> (entro le 5:00)</p><h4>Vetro</h4><p>Lascialo in cucina: penseremo noi a smaltirlo al termine del soggiorno. Ci occupiamo senza problemi anche di eventuali altri rifiuti non conferiti in tempo.</p><p style='margin-top:16px;color:var(--ink-soft);font-size:.85rem;'>I secchi per uso domestico sono sotto il pianale della cucina; eventuali sacchetti aggiuntivi sotto il lavandino.</p>",
  en:"<p><u>Collection is door-to-door: leave the rubbish outside the front door the night before or, at the latest, by 5:00 AM.</u></p><h4>Organic waste</h4><p>YES: food, scraps, dirty tissues, leaves, ashes.<br>NO: sanitary pads, diapers, rags, sponges, gum, cigarettes.<br><b>Collection: Monday, Wednesday, Saturday</b> (by 5:00 AM)</p><h4>Paper</h4><p>YES: newspapers, magazines, cardboard, packaging, Tetra Pak, sheets.<br>NO: laminated paper, baking paper, dirty paper or cardboard.<br><b>Collection: Friday</b> (by 5:00 AM)</p><h4>Plastic and metals</h4><p>YES: bottles, flasks, plastic packaging, disposable plates/glasses, bags, trays, films, boxes, cans, aluminium foil, tubes.<br>NO: toys, broken cutlery, rubber items, pens.<br><b>Collection: Thursday</b> (in July/August also Sunday, by 5:00 AM)</p><h4>General waste</h4><p>YES: diapers, sanitary pads, rags, sponges, toothbrushes, gum, dirty cutlery, cigarettes, light bulbs, ceramics.<br><b>Collection: Tuesday</b> (by 5:00 AM)</p><h4>Glass</h4><p>Leave it in the kitchen area — we'll dispose of it at the end of your stay. We'll also handle any other waste not collected for any reason.</p><p style='margin-top:16px;color:var(--ink-soft);font-size:.85rem;'>Household bins are under the kitchen counter; extra bags are under the sink.</p>",
  fr:"<p><u>La collecte se fait en porte-à-porte : laissez les déchets devant la porte la veille au soir ou, au plus tard, avant 5h00 du matin.</u></p><h4>Déchets organiques</h4><p>OUI : aliments, restes, mouchoirs sales, feuilles, cendres.<br>NON : serviettes hygiéniques, couches, chiffons, éponges, chewing-gum, cigarettes.<br><b>Collecte : lundi, mercredi, samedi</b> (avant 5h)</p><h4>Papier</h4><p>OUI : journaux, magazines, carton, emballages, Tetra Pak, feuilles.<br>NON : papier plastifié, papier sulfurisé, papier/carton sale.<br><b>Collecte : vendredi</b> (avant 5h)</p><h4>Plastique et métaux</h4><p>OUI : bouteilles, flacons, emballages plastique, vaisselle jetable, sacs, barquettes, films, boîtes, canettes, aluminium, tubes.<br>NON : jouets, couverts cassés, objets en caoutchouc, stylos.<br><b>Collecte : jeudi</b> (juillet/août aussi dimanche, avant 5h)</p><h4>Déchets résiduels</h4><p>OUI : couches, serviettes hygiéniques, chiffons, éponges, brosses à dents, chewing-gum, couverts sales, cigarettes, ampoules, céramique.<br><b>Collecte : mardi</b> (avant 5h)</p><h4>Verre</h4><p>Laissez-le dans la cuisine, nous nous en chargerons à la fin du séjour. Nous gérons aussi tout autre déchet non collecté.</p><p style='margin-top:16px;color:var(--ink-soft);font-size:.85rem;'>Poubelles sous le plan de travail ; sacs supplémentaires sous l'évier.</p>",
  es:"<p><u>La recogida es puerta a puerta: deja la basura fuera la noche anterior o, como máximo, antes de las 5:00 de la mañana.</u></p><h4>Residuos orgánicos</h4><p>SÍ: comida, restos, pañuelos sucios, hojas, cenizas.<br>NO: toallas sanitarias, pañales, trapos, esponjas, chicles, cigarrillos.<br><b>Recogida: lunes, miércoles, sábado</b> (antes de las 5:00)</p><h4>Papel</h4><p>SÍ: periódicos, revistas, cartón, embalajes, Tetra Pak, hojas.<br>NO: papel plastificado, papel de horno, papel/cartón sucio.<br><b>Recogida: viernes</b> (antes de las 5:00)</p><h4>Plástico y metales</h4><p>SÍ: botellas, frascos, embalajes de plástico, vajilla desechable, bolsas, bandejas, láminas, cajas, latas, aluminio, tubos.<br>NO: juguetes, cubiertos rotos, objetos de goma, bolígrafos.<br><b>Recogida: jueves</b> (julio/agosto también domingo, antes de las 5:00)</p><h4>Resto</h4><p>SÍ: pañales, toallas sanitarias, trapos, esponjas, cepillos, chicles, cubiertos sucios, cigarrillos, bombillas, cerámica.<br><b>Recogida: martes</b> (antes de las 5:00)</p><h4>Vidrio</h4><p>Déjalo en la cocina, nos encargamos al final de la estancia. También gestionamos cualquier otro residuo no recogido.</p><p style='margin-top:16px;color:var(--ink-soft);font-size:.85rem;'>Cubos bajo la encimera; bolsas extra bajo el fregadero.</p>",
  de:"<p><u>Die Abholung erfolgt als Haustürsammlung: Müll am Vorabend oder spätestens bis 5:00 Uhr vor die Tür stellen.</u></p><h4>Organische Abfälle</h4><p>JA: Essensreste, schmutzige Taschentücher, Blätter, Asche.<br>NEIN: Damenbinden, Windeln, Lumpen, Schwämme, Kaugummi, Zigaretten.<br><b>Abholung: Montag, Mittwoch, Samstag</b> (bis 5:00 Uhr)</p><h4>Papier</h4><p>JA: Zeitungen, Zeitschriften, Karton, Verpackungen, Tetra Pak, Blätter.<br>NEIN: laminiertes Papier, Backpapier, verschmutztes Papier/Karton.<br><b>Abholung: Freitag</b> (bis 5:00 Uhr)</p><h4>Kunststoffe und Metalle</h4><p>JA: Flaschen, Kunststoffbehälter, Einweggeschirr, Taschen, Tabletts, Folien, Kisten, Dosen, Alufolie, Tuben.<br>NEIN: Spielzeug, kaputtes Besteck, Gummiartikel, Stifte.<br><b>Abholung: Donnerstag</b> (Juli/August auch Sonntag, bis 5:00 Uhr)</p><h4>Restmüll</h4><p>JA: Windeln, Damenbinden, Lumpen, Schwämme, Zahnbürsten, Kaugummi, schmutziges Besteck, Zigaretten, Glühbirnen, Keramik.<br><b>Abholung: Dienstag</b> (bis 5:00 Uhr)</p><h4>Glas</h4><p>In der Küche lassen, wir entsorgen es am Ende des Aufenthalts. Auch anderer nicht abgeholter Müll wird von uns übernommen.</p><p style='margin-top:16px;color:var(--ink-soft);font-size:.85rem;'>Mülltonnen unter der Küchenarbeitsplatte; zusätzliche Beutel unter der Spüle.</p>",
  no:"<p><u>Innsamlingen skjer dør-til-dør: sett søppelet utenfor porten kvelden før eller senest innen kl. 05:00.</u></p><h4>Organisk</h4><p>JA: mat, matvarer, skitne lommetørklær, blader, aske.<br>NEI: bind, bleier, filler, svamper, gummi, sigaretter.<br><b>Henting: mandag, onsdag, lørdag</b> (før kl. 5:00)</p><h4>Papir</h4><p>JA: aviser, magasiner, papp, emballasje, tetra-pak, ark.<br>NEI: laminert papir, bakepapir, skittent papir/papp.<br><b>Henting: fredag</b> (før kl. 5:00)</p><h4>Plast og metaller</h4><p>JA: flasker, plastemballasje, engangsservise, poser, skuffer, folier, bokser, aluminium, rør.<br>NEI: leker, ødelagt bestikk, gummigjenstander, penner.<br><b>Henting: torsdag</b> (juli/august også søndag, før kl. 5:00)</p><h4>Restavfall</h4><p>JA: bleier, bind, filler, svamper, tannbørster, gummi, skittent bestikk, sigaretter, pærer, keramikk.<br><b>Henting: tirsdag</b> (før kl. 5:00)</p><h4>Glass</h4><p>La det stå på kjøkkenet, vi tar hånd om det ved oppholdets slutt. Vi håndterer også annet avfall som ikke ble hentet.</p><p style='margin-top:16px;color:var(--ink-soft);font-size:.85rem;'>Søppelbøtter under kjøkkenbenken; ekstra poser under vasken.</p>"
};

const EMERGENCY_NUMBERS = [{num:"112", key:"num112"},{num:"118", key:"num118"},{num:"113", key:"num113"},{num:"115", key:"num115"}];

let currentLang = "it";
let currentView = "hub";
let currentCat = null;
let currentParent = null;

function t(){ return I18N[currentLang]; }
function renderLangSelector(){
  const el = document.getElementById("langSelect");
  el.innerHTML = Object.keys(I18N).map(code =>
    "<button class='lang-btn " + (code===currentLang?'active':'') + "' data-lang='" + code + "'>" + I18N[code].flag + " " + I18N[code].label + "</button>").join("");
  el.querySelectorAll(".lang-btn").forEach(btn=> btn.addEventListener("click", ()=>{ currentLang = btn.dataset.lang; renderAll(); }));
}
function renderStaticText(){
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-i18n]").forEach(elm=>{
    const key = elm.getAttribute("data-i18n");
    if(t()[key]) elm.textContent = t()[key];
  });
}
function catIcon(id){ return ICONS[id] || ICONS.servizi; }
function catLabel(id){ return t().cat[id] || id; }
function catNote(id){ return t().note[id] || ""; }

function renderGrid(containerId, ids, onOpen){
  const grid = document.getElementById(containerId);
  grid.innerHTML = ids.map(id =>
    "<button class='cat-btn " + (id==='emergenza'?'emergenza':'') + " " + (id==='farmacie'?'farmacie':'') + "' data-cat='" + id + "'>" +
    "<span class='cat-icon'>" + catIcon(id) + "</span><span class='cat-label'>" + catLabel(id) + "</span></button>").join("");
  grid.querySelectorAll(".cat-btn").forEach(btn=> btn.addEventListener("click", ()=> onOpen(btn.dataset.cat)));
}
function showView(id){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function renderSubHub(parentId){
  document.getElementById("subHubTitle").textContent = catLabel(parentId);
  document.getElementById("subHubNote").textContent = catNote(parentId);
  renderGrid("subHubGrid", SUBMENUS[parentId], openSubCategory);
}
const VIEW_IDS = {hub:"hub", subHub:"subHub", detail:"detailView", external:"externalView", info:"infoView", tipForm:"tipFormView", tipList:"tipListView"};

function renderCurrentView(){
  if(currentView === "subHub") renderSubHub(currentParent);
  else if(currentView === "detail") renderDetail();
  else if(currentView === "external") renderExternal();
  else if(currentView === "info") renderInfo();
  else if(currentView === "tipForm") renderTipForm();
  else if(currentView === "tipList") renderTipList();
}
function applyState(state){
  currentView = (state && state.view) || "hub";
  currentParent = (state && state.parent) || null;
  currentCat = (state && state.cat) || null;
  showView(VIEW_IDS[currentView] || "hub");
  renderCurrentView();
}
function navigate(state){
  history.pushState(state, "");
  applyState(state);
}
window.addEventListener("popstate", (e)=>{ applyState(e.state); });

function openTopCategory(id){
  if(INFO_TYPES.includes(id)){ navigate({view:"info", cat:id}); return; }
  if(SUBMENUS[id]){ navigate({view:"subHub", parent:id}); return; }
  if(id === "come-arrivare" || id === "guida-casa" || id === "recensione"){ navigate({view:"external", cat:id}); return; }
  navigate({view:"detail", parent:"hub", cat:id});
}

function openSubCategory(id){
  if(currentParent === "consigli"){
    if(id === "lascia"){ navigate({view:"tipForm", parent:"consigli", cat:id}); }
    if(id === "leggi"){ navigate({view:"tipList", parent:"consigli", cat:id}); }
    return;
  }
  navigate({view:"detail", parent:currentParent, cat:id});
}

function renderVenueCard(v){
  if(v.isLink){
    return "<div class='venue-card'><div class='venue-name'>" + v.name + "</div><div class='venue-actions'><a class='btn-link' href='" + v.link + "' target='_blank' rel='noopener'>" + t().open + " ↗</a></div></div>";
  }
  if(v.links){
    return "<div class='venue-card'><div class='venue-name'>" + v.name + "</div><div class='venue-actions'>" +
      v.links.map(l=>"<a class='btn-link' href='" + l.url + "' target='_blank' rel='noopener'>" + l.label + " ↗</a>").join("") + "</div></div>";
  }
  const descText = d(v.desc);
  return "<div class='venue-card'>" +
      "<div class='venue-name-row'><span class='venue-name'>" + v.name + "</span>" + (v.tip? "<span class='tip-badge'>"+t().tip+"</span>" : "") + "</div>" +
      (v.address ? "<div class='venue-address'>" + v.address + "</div>" : "") +
      (descText ? "<div class='venue-desc'>" + descText + "</div>" : "") +
      "<div class='venue-actions'>" +
        (v.placeId ? "<a class='btn-maps' href='" + mapsUrl(v.name, v.placeId) + "' target='_blank' rel='noopener'>" + t().maps + " ↗</a>" : "") +
        (v.phone ? "<a class='btn-call' href='" + telUrl(v.phone) + "'>" + t().call + "</a>" : "") +
      "</div></div>";
}

function renderDetail(){
  if(!currentCat) return;
  document.getElementById("backLabel").textContent = t().back;
  document.getElementById("detailTitle").textContent = catLabel(currentCat);
  document.getElementById("detailNote").textContent = catNote(currentCat);

  const emBox = document.getElementById("emergencyNumbers");
  const venueList = document.getElementById("venueList");
  const articleList = document.getElementById("articleList");
  const pinsLabel = document.getElementById("pinsLabel");
  articleList.innerHTML = ""; venueList.innerHTML = ""; emBox.innerHTML = ""; pinsLabel.style.display = "none";

  if(currentCat === "dintorni"){
    const arts = DINTORNI[currentLang] || DINTORNI.en;
    articleList.innerHTML = "<div class='section-label'>" + t().sectionRead + "</div>" + arts.map(a =>
      "<div class='article-card'><div class='article-title'>" + a.title + "</div><div class='article-preview'>" + a.preview + "</div><div class='article-actions'>" +
      (a.placeId ? "<a class='btn-maps' href='" + mapsUrl(a.placeName || a.title, a.placeId) + "' target='_blank' rel='noopener'>" + t().maps + " ↗</a>" : "") +
      (a.bookingUrl ? "<a class='btn-link' href='" + a.bookingUrl + "' target='_blank' rel='noopener'>" + a.bookingText + " ↗</a>" : "") +
      "<a class='btn-read' href='guida-citta.html#" + a.id + "' target='_blank' rel='noopener'>" + t().readMore + " ↗</a>" +
      "</div></div>").join("");
    pinsLabel.style.display = "block"; pinsLabel.textContent = t().sectionSee;
    venueList.innerHTML = DINTORNI_PINS.map(renderVenueCard).join("");
    return;
  }
  if(currentCat === "emergenza"){
    emBox.innerHTML = "<div class='emergency-grid'>" + EMERGENCY_NUMBERS.map(n=>
      "<div class='emergency-num'><a href='tel:" + n.num + "'>" + n.num + "</a><span>" + t()[n.key] + "</span></div>").join("") + "</div>";
  }
  const items = VENUES[currentCat] || [];
  if(items.length === 0){ venueList.innerHTML = "<div class='empty-state'>" + t().emptyState + "</div>"; return; }
  venueList.innerHTML = items.map(renderVenueCard).join("");
}

function renderExternal(){
  const box = document.getElementById("externalBox");
  if(currentCat === "come-arrivare"){
    document.getElementById("externalTitle").textContent = t().comeArrivareTitle;
    box.innerHTML = "<p>" + t().comeArrivareDesc + "</p><a class='big-btn' href='assets/indicazioni-arrivo.pdf' target='_blank' rel='noopener'>📄 " + t().comeArrivareBtn + "</a>";
  } else if(currentCat === "guida-casa"){
    document.getElementById("externalTitle").textContent = t().guidaCasaTitle;
    box.innerHTML = "<p>" + t().guidaCasaDesc + "</p><a class='big-btn' href='assets/guida-casa.pdf' target='_blank' rel='noopener'>📖 " + t().guidaCasaBtn + "</a>";
  } else if(currentCat === "recensione"){
    document.getElementById("externalTitle").textContent = catLabel("recensione");
    box.innerHTML = "<p>" + t().reviewDesc + "</p><a class='big-btn' href='https://g.page/r/CeuiU_Xp7nDbEBM/review' target='_blank' rel='noopener'>⭐ " + t().reviewBtn + "</a>";
  }
}

function renderInfo(){
  document.getElementById("infoTitle").textContent = catLabel(currentCat);
  const box = document.getElementById("infoBox");
  if(currentCat === "checkout"){
    box.innerHTML = "<p>" + (CHECKOUT_TEXT[currentLang] || CHECKOUT_TEXT.it) + "</p>";
  } else if(currentCat === "wifi"){
    box.innerHTML =
      "<div class='wifi-row'><span class='wifi-label'>" + t().wifiNetwork + "</span><span class='wifi-value'>Appartamento_terrazza_galba</span></div>" +
      "<div class='wifi-row'><span class='wifi-label'>" + t().wifiPassword + "</span><span class='wifi-value'>Galba25</span></div>";
  } else if(currentCat === "raccolta"){
    box.innerHTML = RACCOLTA_HTML[currentLang] || RACCOLTA_HTML.it;
  }
}

function renderTipForm(){
  document.getElementById("tipFormTitle").textContent = catLabel("lascia");
  const monthOptions = t().months.map(m=>"<option value='" + m + "'>" + m + "</option>").join("");
  document.getElementById("tipFormCard").innerHTML =
    "<div class='form-field'><label>" + t().formNome + "</label><input type='text' id='tipNome' maxlength='20'></div>" +
    "<div class='form-field'><label>" + t().formMese + "</label><select id='tipMese'><option value=''>" + t().formSceglimese + "</option>" + monthOptions + "</select></div>" +
    "<div class='form-field'><label>" + t().formSuggerimento + "</label><textarea id='tipTesto' maxlength='300'></textarea><div class='char-count'><span id='tipCharCount'>0</span>/300</div></div>" +
    "<button class='big-btn' id='tipSubmitBtn' style='width:100%;justify-content:center;'>" + t().formInvia + "</button>" +
    "<div class='form-msg' id='tipFormMsg'></div>";
  document.getElementById("tipTesto").addEventListener("input", (e)=>{
    document.getElementById("tipCharCount").textContent = e.target.value.length;
  });
  document.getElementById("tipSubmitBtn").addEventListener("click", submitTip);
}
const SUPABASE_FUNCTION_URL = SUPABASE_URL ? (SUPABASE_URL + "/functions/v1/translate-tip") : "";

async function submitTip(){
  const msg = document.getElementById("tipFormMsg");
  msg.className = "form-msg"; msg.style.display = "none";
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    msg.textContent = t().formNotConfigured; msg.className = "form-msg err"; return;
  }
  const nome = document.getElementById("tipNome").value.slice(0,20);
  const mese = document.getElementById("tipMese").value;
  const testo = document.getElementById("tipTesto").value.slice(0,300).trim();
  if(!testo){ return; }
  try{
    const res = await fetch(SUPABASE_FUNCTION_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY },
      body: JSON.stringify({ nome: nome || null, mese: mese || null, testo: testo, lang: currentLang })
    });
    if(res.ok){
      msg.textContent = t().formOk; msg.className = "form-msg ok";
      document.getElementById("tipNome").value = ""; document.getElementById("tipMese").value = "";
      document.getElementById("tipTesto").value = ""; document.getElementById("tipCharCount").textContent = "0";
    } else { msg.textContent = t().formErr; msg.className = "form-msg err"; }
  } catch(e){ msg.textContent = t().formErr; msg.className = "form-msg err"; }
}
async function renderTipList(){
  document.getElementById("tipListTitle").textContent = catLabel("leggi");
  const box = document.getElementById("tipListBox");
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    box.innerHTML = "<div class='empty-state'>" + t().formNotConfigured + "</div>"; return;
  }
  box.innerHTML = "<div class='empty-state'>" + t().emptyState + "</div>";
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/consigli?select=nome,mese,testo,created_at&order=created_at.desc&limit=50", {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": "Bearer " + SUPABASE_ANON_KEY }
    });
    if(!res.ok) throw new Error("fetch failed");
    const rows = await res.json();
    if(rows.length === 0){ box.innerHTML = "<div class='empty-state'>" + t().nessunConsiglio + "</div>"; return; }
    box.innerHTML = rows.map(r => {
      let testoShown = r.testo;
      if(testoShown && typeof testoShown === "object"){
        testoShown = testoShown[currentLang] || testoShown.it || Object.values(testoShown).find(v=>v) || "";
      }
      return "<div class='tip-card'><div class='tip-meta'>" + (r.nome || t().anonimo) + (r.mese ? " · " + r.mese : "") + "</div><div class='tip-text'>" + testoShown + "</div></div>";
    }).join("");
  } catch(e){ box.innerHTML = "<div class='empty-state'>" + t().formErr + "</div>"; }
}

function renderAll(){
  renderLangSelector(); renderStaticText();
  renderGrid("catGrid", TOP_CATEGORIES, openTopCategory);
  renderCurrentView();
}
document.getElementById("backBtn").addEventListener("click", ()=> history.back());
document.querySelectorAll("[data-back]").forEach(btn=> btn.addEventListener("click", (e)=>{ e.preventDefault(); history.back(); }));
document.querySelectorAll("[data-open]").forEach(btn=> btn.addEventListener("click", (e)=>{ e.preventDefault(); openTopCategory(btn.dataset.open); }));

history.replaceState({view:"hub"}, "");
renderAll();
</script>
